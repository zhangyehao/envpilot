name: release-assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package envpilot for (v0.1.3 or 0.1.3)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag
        id: resolve_tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            resolved_tag="$tag"
          elif git rev-parse --verify --quiet "refs/tags/v$tag" >/dev/null; then
            resolved_tag="v$tag"
          else
            echo "Tag not found: $tag" >&2
            exit 1
          fi
          echo "tag=$resolved_tag" >> "$GITHUB_OUTPUT"
      - name: Build envpilot release archives
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.resolve_tag.outputs.tag }}"
          version="${tag#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="envpilot-${version}/" -o "dist/envpilot-${version}.tar.gz" "$tag"
          git archive --format=zip --prefix="envpilot-${version}/" -o "dist/envpilot-${version}.zip" "$tag"
          sha256sum dist/envpilot-${version}.tar.gz dist/envpilot-${version}.zip > "dist/envpilot-${version}.sha256"
      - name: Upload envpilot release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
