name: release-assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable release tag, for example v0.4.0"
        required: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag and version
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" == v* ]] || tag="v$tag"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid stable tag'; exit 1; }
          git rev-parse --verify "refs/tags/$tag"
          test "$(git show "$tag:VERSION" | tr -d '\r\n')" = "${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  verify:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}
  package:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Build source and platform packages
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="envpilot-${version}/" -o "dist/envpilot-${version}.tar.gz" "$RELEASE_TAG"
          git archive --format=zip --prefix="envpilot-${version}/" -o "dist/envpilot-${version}.zip" "$RELEASE_TAG"
          python scripts/build-release.py
          bash tests/test-package.sh "dist/envpilot-${version}-linux-amd64.tar.gz"
      - name: Upload verified release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
