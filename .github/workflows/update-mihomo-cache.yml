name: update-mihomo-cache

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate cache refresh script
        run: python scripts/update-mihomo-cache.py --check
      - name: Refresh bundled mihomo cache
        run: python scripts/update-mihomo-cache.py
      - name: Open PR if cache changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: refresh bundled mihomo cache
          title: "[envpilot] refresh bundled mihomo cache"
          body: "Automated refresh of the bundled stable mihomo Linux/Windows amd64 cache files plus country.mmdb and geoip.metadb."
          branch: codex/update-mihomo-cache
