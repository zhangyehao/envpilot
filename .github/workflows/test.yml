name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shell tests
        run: bash tests/run-tests.sh
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck envpilot.sh bootstrap.sh lib/*.sh components/*.sh templates/*.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bash syntax
        run: bash tests/run-tests.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell tests
        shell: pwsh
        run: ./tests/test-envpilot.ps1
